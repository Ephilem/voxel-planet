name: Build

on:
  push:
    branches: [main, develop, "ci/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

env:
  BUILD_TYPE: Release
  VULKAN_SDK_VERSION: "1.4.328.1"

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git hash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_NUMBER=${{ github.run_number }} \
            -DENABLE_TRACY=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp build/VoxelPlanet artifact/
          cp -r build/assets artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelPlanet-Linux-${{ github.run_number }}
          path: artifact/
          retention-days: 30

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-windows

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = "${{ env.VULKAN_SDK_VERSION }}"
          $url = "https://sdk.lunarg.com/sdk/download/${ver}/windows/VulkanSDK-${ver}-Installer.exe"
          Write-Host "Downloading Vulkan SDK from $url"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK-Installer.exe
          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath .\VulkanSDK-Installer.exe -ArgumentList "--root C:\VulkanSDK\${ver} --accept-licenses --default-answer --confirm-command install" -Wait
          Remove-Item VulkanSDK-Installer.exe

      - name: Set Vulkan SDK environment
        shell: pwsh
        run: |
          $ver = "${{ env.VULKAN_SDK_VERSION }}"
          echo "VULKAN_SDK=C:\VulkanSDK\${ver}" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\${ver}\Bin" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_NUMBER=${{ github.run_number }} `
            -DENABLE_TRACY=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item "build/${{ env.BUILD_TYPE }}/VoxelPlanet.exe" -Destination artifact/
          Copy-Item -Recurse "build/assets" -Destination artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelPlanet-Windows-${{ github.run_number }}
          path: artifact/
          retention-days: 30

  # Release job - only runs on version tags
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: VoxelPlanet-Linux-${{ github.run_number }}
          path: linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: VoxelPlanet-Windows-${{ github.run_number }}
          path: windows

      - name: Create archives
        run: |
          cd linux && zip -r ../VoxelPlanet-${{ github.ref_name }}-Linux.zip . && cd ..
          cd windows && zip -r ../VoxelPlanet-${{ github.ref_name }}-Windows.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            VoxelPlanet-${{ github.ref_name }}-Linux.zip
            VoxelPlanet-${{ github.ref_name }}-Windows.zip